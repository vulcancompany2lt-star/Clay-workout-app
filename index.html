const KEY='clay_workout_app_v4';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{tab:'HOME',week:1,values:{},weights:{},workout:'A',history:[]};let seconds=90,timerId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function k(w,i,s){return w+'|'+i+'|'+s}function v(key){return state.values[key]||{weight:'',reps:'',done:false}}function go(t){state.tab=t;save();render()}function setWeek(w){state.week=+w;save();render()}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>x.classList.remove('show'),1500)}function total(){let d=0,t=0;for(let w of Object.keys(WORKOUTS))WORKOUTS[w].ex.forEach((e,i)=>{for(let s=0;s<e[1];s++){t++;if(v(k(w,i,s)).done)d++}});return[d,t]}
function render(){document.getElementById('week').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>Week ${i+1}</option>`).join('');document.getElementById('badge').textContent=state.week===4||state.week===8?'DELOAD WEEK':'12-WEEK RECOMPOSITION';let m={HOME:'home',WORK:'work',PROG:'prog',PLAN:'plan'};['home','work','prog','plan'].forEach(x=>document.getElementById('n-'+x).classList.remove('active'));document.getElementById('n-'+m[state.tab]).classList.add('active');({HOME:home,WORK:workouts,PROG:progress,PLAN:planView,HIST:historyView}[state.tab]||home)()}
function sessionKey(w,week){return w+'-'+week+'-'+new Date().toISOString().slice(0,10)}
function logSession(w){let key=sessionKey(w,state.week);if(!state.history.some(x=>x.key===key)){state.history.unshift({key,date:new Date().toISOString(),workout:w,week:state.week});state.history=state.history.slice(0,100);save();toast('Workout saved ✓')}}
function streak(){let days=[...new Set(state.history.map(x=>x.date.slice(0,10)))].sort().reverse();if(!days.length)return 0;let n=0,d=new Date();for(let i=0;i<days.length;i++){let target=new Date(d);target.setDate(d.getDate()-i);let iso=target.toISOString().slice(0,10);if(days.includes(iso))n++;else break}return n}
function prFor(w,i){let best=0;WORKOUTS[w].ex[i]&&Object.keys(state.values).forEach(key=>{let z=state.values[key];if(key.startsWith(w+'-'+i+'-')&&z.weight&&z.reps){let e=Number(z.weight),r=Number(z.reps);if(Number.isFinite(e)&&Number.isFinite(r))best=Math.max(best,e*(1+r/30))}});return best}
function topPRs(){let arr=[];Object.keys(WORKOUTS).forEach(w=>WORKOUTS[w].ex.forEach((e,i)=>{let p=prFor(w,i);if(p)arr.push({name:e[0],score:p,w,i})}));return arr.sort((a,b)=>b.score-a.score).slice(0,5)}
function home(){let [d,t]=total();document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">Week ${state.week} • ${state.week===4||state.week===8?'Deload':'Training block'}</div><h1>Good afternoon, Clay.</h1><p>Your plan is ready. Train with intent, log every set, and let the numbers build over time.</p><div class="stats"><div class="stat"><b>${d}</b><small>sets completed</small></div><div class="stat"><b>3</b><small>strength days</small></div><div class="stat"><b>2</b><small>cardio days</small></div><div class="stat"><b>${streak()}</b><small>day streak</small></div></div></section><div class="section"><h2>Today's training</h2><span>Choose a workout</span></div>${['A','B','C'].map(card).join('')}<div class="section"><h2>Quick targets</h2><span>Week ${state.week}</span></div><div class="grid"><div class="metric"><b>${N.cal}</b><small>calories / day</small></div><div class="metric"><b>${N.protein}</b><small>protein / day</small></div><div class="metric"><b>${CARD[state.week-1].split('×')[0].trim()}</b><small>cardio focus</small></div><div class="metric"><b>7–10k</b><small>steps / day</small></div></div>`}
function card(w){let d=WORKOUTS[w],done=0,total=0;d.ex.forEach((e,i)=>{for(let s=0;s<e[1];s++){total++;if(v(k(w,i,s)).done)done++}});return `<section class="card workout"><div class="wtop"><div class="wicon">${w}</div><div class="winfo"><h3>${d.name}</h3><p>${d.focus} • ${d.ex.length} exercises</p><span class="pill">${done}/${total} sets</span></div></div><div class="list">${d.ex.map((e,i)=>`<div class="row"><div class="num">${i+1}</div><div class="rowmain"><b>${esc(e[0])}</b><small>${e[1]} × ${esc(e[2])} • ${e[3]} sec rest</small></div><div class="dot ${Array.from({length:e[1]},(_,s)=>v(k(w,i,s)).done).every(Boolean)?'done':''}"></div></div>`).join('')}</div><div class="actions"><button class="btn" onclick="startWorkout('${w}')">Start ${d.name}</button></div></section>`}
function startWorkout(w){state.tab='WORK';state.workout=w;save();render()}function workouts(){let w=state.workout||'A';let d=WORKOUTS[w];document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">Week ${state.week}</div><h1>${d.name}</h1><p>${d.focus}. Complete the prescribed sets with good form. When every set reaches the top of the rep range, add load next time.</p></section><div class="sessionbar"><b>Workout ${w} • Week ${state.week}</b><span>${streak()} day streak</span></div><div class="actions" style="padding:0 0 5px"><button class="btn dark" onclick="pick('A')">A</button><button class="btn dark" onclick="pick('B')">B</button><button class="btn dark" onclick="pick('C')">C</button></div>${d.ex.map((e,i)=>exercise(w,e,i)).join('')}<button class="btn finish" onclick="logSession('${w}')">✓ Finish & Save Workout</button>`}
function pick(w){state.workout=w;save();render()}function illustration(name){let n=name.toLowerCase(),mode=n.includes('press')||n.includes('push')?'press':n.includes('row')||n.includes('pulldown')||n.includes('pull-up')?'pull':'lower';let arms=mode==='press'?'M55 65 L25 48 M55 65 L85 48':mode==='pull'?'M55 60 L28 76 M55 60 L82 76':'M55 65 L41 98 M55 65 L69 98';return `<svg width="150" height="120" viewBox="0 0 110 120"><circle cx="55" cy="20" r="10" fill="none" stroke="#ff5b5d" stroke-width="4"/><path class="bodyline" d="M55 30 L55 65 ${arms} M55 65 L42 103 M55 65 L68 103"/><path class="redline" d="M17 105 H93"/></svg>`}
function exercise(w,e,i){let done=0;for(let s=0;s<e[1];s++)if(v(k(w,i,s)).done)done++;let pct=done/e[1]*100;return `<section class="exercise" id="ex-${i}"><div class="visual">${illustration(e[0])}<span class="tag">${esc(e[4])}</span></div><div class="exbody"><div class="exhead"><div><h2>${esc(e[0])}</h2><p>${e[1]} sets × ${esc(e[2])} • ${e[3]} sec rest</p>${prFor(w,i)?`<span class="prbadge">🏆 PR logged</span>`:``}</div><button class="info" onclick="details(${i})">ⓘ</button></div><div class="details" id="det-${i}"><h4>How to perform</h4><p>${esc(e[5])}</p><div>${e[4].split(' • ').map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')}</div></div><div class="sets">${Array.from({length:e[1]},(_,s)=>{let z=v(k(w,i,s));return `<div class="set"><div class="setno">${s+1}</div><input inputmode="decimal" placeholder="Weight" value="${esc(z.weight)}" oninput="field('${w}',${i},${s},'weight',this.value)"><input inputmode="numeric" placeholder="${esc(e[2])}" value="${esc(z.reps)}" oninput="field('${w}',${i},${s},'reps',this.value)"><button class="check ${z.done?'done':''}" onclick="toggle('${w}',${i},${s})">${z.done?'✓':'○'}</button></div>`}).join('')}</div><div class="completion"><span>${done}/${e[1]} sets complete</span><span>${Math.round(pct)}%</span></div><div class="prog"><div class="fill" style="width:${pct}%"></div></div><div class="rest"><button class="btn dark" onclick="openTimer(${e[3]})">⏱ ${e[3]}s Rest</button><button class="btn" onclick="nextEx(${i})">Next →</button></div></div></section>`}
function details(i){document.getElementById('det-'+i).classList.toggle('open')}function field(w,i,s,f,x){let z=v(k(w,i,s));z[f]=x;state.values[k(w,i,s)]=z;save()}function toggle(w,i,s){let z=v(k(w,i,s));z.done=!z.done;if(z.done)z.completedAt=new Date().toISOString();state.values[k(w,i,s)]=z;save();render();setTimeout(()=>document.getElementById('ex-'+i)?.scrollIntoView({behavior:'smooth',block:'center'}),20);if(z.done)toast('Set completed ✓');let all=WORKOUTS[w].ex.every((e,ii)=>Array.from({length:e[1]},(_,ss)=>v(k(w,ii,ss)).done).every(Boolean));if(all)logSession(w)}function nextEx(i){let n=i+1;if(n<WORKOUTS[state.workout||'A'].ex.length)document.getElementById('ex-'+n)?.scrollIntoView({behavior:'smooth',block:'start'});else toast('Workout complete — great job!')}
function progress(){let pts=Array.from({length:12},(_,i)=>({x:i+1,y:parseFloat(state.weights[i+1])})).filter(p=>Number.isFinite(p.y));let vals=pts.length?pts.map(p=>p.y):[210],lo=Math.min(...vals)-2,hi=Math.max(...vals)+2,path=pts.length>1?pts.map((p,i)=>`${i?'L':'M'} ${10+(p.x-1)*80/11} ${160-(p.y-lo)*130/(hi-lo||1)}`).join(' '):'';let [d,t]=total(),prs=topPRs();document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">Your progress</div><h1>Stronger than last week.</h1><p>Track body weight, training consistency, and your best logged lifts across the 12-week block.</p></section><div class="grid"><div class="metric"><b>${d}</b><small>sets completed</small></div><div class="metric"><b>${Math.round(d/t*100)}%</b><small>plan completion</small></div><div class="metric"><b>${state.history.length}</b><small>workouts saved</small></div><div class="metric"><b>${streak()}</b><small>day streak</small></div></div><div class="section"><h2>Body weight</h2><span>Weekly trend</span></div><div class="card"><div class="chart"><svg viewBox="0 0 100 180" preserveAspectRatio="none"><line class="axis" x1="0" y1="160" x2="100" y2="160"/><line class="axis" x1="0" y1="30" x2="100" y2="30"/>${path?`<path class="chartline" d="${path}"/>`:''}${pts.map(p=>`<circle class="cdot" cx="${10+(p.x-1)*80/11}" cy="${160-(p.y-lo)*130/(hi-lo||1)}" r="2.3"/>`).join('')}</svg></div>${pts.length<2?'<div class="empty">Enter two or more weekly weights to see your trend.</div>':''}</div><div class="section"><h2>Top logged PRs</h2><span>Estimated strength</span></div><div class="card">${prs.length?prs.map((p,i)=>`<div class="planrow"><b>${i+1}. ${esc(p.name)}</b><span>${Math.round(p.score)} pts</span></div>`).join(''):'<div class="tip">Log weight and reps on your sets to start building your PR list.</div>'}</div><div class="section"><h2>Weekly check-ins</h2><span>lb</span></div><div class="card">${Array.from({length:12},(_,i)=>`<div class="planrow"><b>Week ${i+1}${i+1===4||i+1===8?' • Deload':''}</b><span><input style="width:86px;background:#0f1114;color:#fff;border:1px solid #30343c;border-radius:9px;padding:7px" inputmode="decimal" placeholder="Weight" value="${esc(state.weights[i+1]||'')}" oninput="setWeight(${i+1},this.value)"></span></div>`).join('')}</div>`}
function setWeight(w,x){state.weights[w]=x;save();clearTimeout(window.ct);window.ct=setTimeout(progress,400)}function historyView(){document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">Training history</div><h1>Show up. Stack wins.</h1><p>Your saved workouts and training streak live here. Finish a workout to add it automatically.</p></section><div class="card"><div class="bigmetric"><div><b>${state.history.length}</b><span> workouts saved</span></div><div><b>${streak()}</b><span> day streak</span></div></div></div><div class="section"><h2>Recent workouts</h2><span>Newest first</span></div><div class="card">${state.history.length?state.history.slice(0,30).map(x=>{let d=new Date(x.date),label=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});return `<div class="historyitem"><div class="hdate">${label}</div><div><b>Workout ${esc(x.workout)}</b><small>Week ${x.week} • ${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</small></div></div>`}).join(''):'<div class="tip">No saved workouts yet. Tap Finish & Save Workout when you complete a session.</div>'}</div>`}
function planView(){document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">Your 12-week plan</div><h1>Train smart. Recover. Repeat.</h1><p>Full-body lifting 3 days/week, cardio 2 days/week, and nutrition built around recomposition.</p></section><div class="section"><h2>Nutrition targets</h2><span>Daily</span></div><div class="nutrition">${Object.entries(N).map(([k,x])=>`<div class="n"><b>${x}</b><small>${({cal:'calories',protein:'protein',fat:'fat',carbs:'carbohydrates',water:'water'})[k]}</small></div>`).join('')}</div><div class="section"><h2>Cardio</h2><span>Week ${state.week}</span></div><div class="card"><div class="planrow"><b>Sessions</b><span>${CARD[state.week-1]}</span></div><div class="planrow"><b>Daily activity</b><span>7,000–10,000 steps</span></div></div><div class="section"><h2>Progression rules</h2></div><div class="card"><div class="planrow"><b>Weeks 1–3</b><span>Build volume and reps.</span></div><div class="planrow"><b>Week 4</b><span>Deload; reduce sets ~35–40%.</span></div><div class="planrow"><b>Weeks 5–7</b><span>Increase loads toward top of ranges.</span></div><div class="planrow"><b>Week 8</b><span>Deload again.</span></div><div class="planrow"><b>Weeks 9–11</b><span>Strongest block; add load when earned.</span></div><div class="planrow"><b>Week 12</b><span>Rep PRs with good form; no true maxes.</span></div></div><div class="section"><h2>Adjustment rule</h2></div><div class="card"><p style="margin:0;color:#c9ccd2;font-size:12px;line-height:1.55">If body weight and waist are unchanged for 2–3 weeks, reduce about 100–150 kcal/day. If losing more than 1.5 lb/week or strength/recovery falls, add about 100–150 kcal/day.</p></div>`}
function openTimer(n){seconds=+n||90;update();document.getElementById('timer').classList.add('show')}function closeTimer(){clearInterval(timerId);timerId=null;document.getElementById('timer').classList.remove('show')}function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{seconds--;update();if(seconds<=0){clearInterval(timerId);timerId=null;navigator.vibrate?.([250,100,250]);toast('Rest complete — next set!')}},1000)}function adjust(n){seconds=Math.max(0,seconds+n);update()}function update(){let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('clock').textContent=m+':'+String(s).padStart(2,'0')}render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6').catch(()=>{}));
</script></body></html>
